# yaml-language-server: $schema=https://json.schemastore.org/github-issue-forms.json

name: 🐛 Report a problem
description: Errors, unexpected behavior, or broken features, including AI analysis
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        ### Before submitting
        **Please use the latest version of this TrendRadar fork.**
        The problem may already be fixed in newer code. Update your installation and try again first.

        A concise description and a useful screenshot make the problem easier to diagnose.

        ### How to find your version

        | Deployment | Where to look |
        |------------|---------------|
        | **Docker** | The version appears at the start of the container logs |
        | **GitHub Actions** | Check the version badge in the [README](https://github.com/CT-Infrastructure/TrendRadar), or the commit used by the workflow |
        | **Local Python** | Read the `version` file in the project root |

  - type: input
    id: version
    attributes:
      label: 📦 TrendRadar version
      description: |
        Include the version number, such as v6.11.0, or the Git commit hash.
        Docker users can check startup logs; Actions users can check the workflow's commit.
      placeholder: v6.11.0 or commit hash
    validations:
      required: true

  - type: input
    id: mcp-version
    attributes:
      label: 🔌 MCP server version (optional)
      description: If you use TrendRadar through MCP, include the MCP server version.
      placeholder: v4.1.1 (leave blank if you do not use MCP)
    validations:
      required: false

  - type: dropdown
    id: bug-category
    attributes:
      label: 🏷️ Problem category
      options:
        - AI analysis (errors, unexpected content, prompt problems)
        - Data collection (missing news, unavailable platforms)
        - Notifications (missing messages, delivery errors)
        - Deployment (Docker, Actions, or Python errors)
        - Other
    validations:
      required: true

  - type: input
    id: ai-model
    attributes:
      label: 🤖 AI model name (needed for AI problems)
      description: |
        For an AI analysis problem, include the exact model name.
        Model capabilities can affect analysis and tool behavior.
      placeholder: "For example: deepseek/deepseek-chat, openai/gpt-4o, gemini/gemini-2.5-flash"
    validations:
      required: false

  - type: textarea
    id: bug-description
    attributes:
      label: 📝 What happened?
      placeholder: |
        Describe:
        1. What were you trying to do?
        2. What happened instead? For AI problems, include the analysis error.
        3. Add a screenshot if it helps explain the problem.
    validations:
      required: true

  - type: textarea
    id: error-logs
    attributes:
      label: 📋 Error logs or configuration (optional)
      description: |
        Include relevant logs or a config.yaml excerpt. Remove API keys and other sensitive values.
        Docker users can view logs with `docker logs trendradar`.
      placeholder: |
        Paste the relevant logs or config.yaml excerpt:
        ```
        Your excerpt here
        ```
    validations:
      required: false

  - type: textarea
    id: screenshots
    attributes:
      label: 📷 Screenshots (recommended)
      description: |
        Include enough context in each screenshot:
        - Errors should show the full message and surrounding context.
        - Notification problems should show the complete message.
        - Configuration problems should show the relevant section.

        Cropped screenshots can omit details needed for diagnosis.
      placeholder: Drag screenshots here, including enough context to understand the problem.
    validations:
      required: false

  - type: dropdown
    id: environment
    attributes:
      label: 🖥️ Environment
      options:
        - Docker (local or NAS)
        - GitHub Actions
        - Local Python
        - MCP client (such as Cherry Studio)
    validations:
      required: true
