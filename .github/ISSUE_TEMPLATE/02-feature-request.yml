# yaml-language-server: $schema=https://json.schemastore.org/github-issue-forms.json

name: 💡 Suggest an improvement
description: Propose a feature, notification layout improvement, or usability change
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        ### Share your idea
        Your suggestions can help improve TrendRadar.

        Current areas of focus include:
        - **AI analysis:** Better interpretation and additional analytical perspectives.
        - **Notifications:** Clearer layouts and more useful information presentation.
        - **Usability:** Simpler configuration and more reliable operation.

        *Requests to add new crawler platforms are not currently accepted.*

  - type: textarea
    id: feature-description
    attributes:
      label: 💭 What is your idea?
      placeholder: |
        Briefly describe:
        - What feature or improvement would you like?
        - What problem would it solve?
        - Include screenshots or examples from other tools if useful.
    validations:
      required: true

  - type: textarea
    id: use-case
    attributes:
      label: 🎯 Use case (optional)
      placeholder: Describe when you would use this and how it would help.
    validations:
      required: false
