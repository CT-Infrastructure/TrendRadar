# yaml-language-server: $schema=https://json.schemastore.org/github-issue-forms.json

name: ✨ Share an AI prompt or ask about configuration
description: Share a customized ai_analysis_prompt.txt or request configuration help
title: "[AI/Config] "
labels: ["config", "AI"]
body:
  - type: markdown
    attributes:
      value: |
        ### Share an AI prompt
        Share a customized `ai_analysis_prompt.txt` that produces useful results.
        Explain how its analysis style differs from the default.

        If you need configuration help, describe the behavior or error you encountered.

        ### How to find your version

        | Deployment | Where to look |
        |------------|---------------|
        | **Docker** | The version appears at the start of the container logs |
        | **GitHub Actions** | Check the version badge in the [README](https://github.com/CT-Infrastructure/TrendRadar), or the commit used by the workflow |
        | **Local Python** | Read the `version` file in the project root |

  - type: dropdown
    id: category
    attributes:
      label: 🏷️ Purpose
      options:
        - Share an AI prompt (ai_analysis_prompt.txt)
        - Ask for help with AI analysis settings
        - Ask for help with basic settings (webhooks, RSS, etc.)
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: 📦 TrendRadar version (needed when requesting help)
      description: |
        Include your version when requesting help.
        Docker users can check startup logs; Actions users can check the workflow's commit.
      placeholder: v6.11.0 or commit hash (optional when sharing a prompt)
    validations:
      required: false

  - type: input
    id: ai-model
    attributes:
      label: 🤖 AI model name
      description: |
        Include the exact model name because model capabilities affect analysis results.
        Include it when sharing prompts too, so others can reproduce your results.
      placeholder: "For example: deepseek/deepseek-chat, openai/gpt-4o, gemini/gemini-2.5-flash"
    validations:
      required: false

  - type: textarea
    id: share-content
    attributes:
      label: 📄 Details
      placeholder: |
        - To share a prompt, paste it in a code block and describe its analysis style.
        - To request help, include a configuration excerpt with secrets removed and explain what happened.
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: 📷 Screenshots (recommended)
      description: |
        Include enough context in each screenshot:
        - For prompt sharing, show the full AI analysis output.
        - For troubleshooting, show the full error or unexpected behavior.

        Cropped screenshots can omit details needed for diagnosis.
      placeholder: Drag screenshots of the analysis or configuration here, including the full relevant context.
    validations:
      required: false
