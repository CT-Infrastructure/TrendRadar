name: Issue Guard

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  pull_request:
    types: [opened]
  pull_request_review_comment:
    types: [created]

jobs:
  moderate:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      models: read
      contents: read
    steps:
      - uses: actions/checkout@v4

      # AI content moderation (spam, link spam, and AI-generated content)
      - uses: github/ai-moderator@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          spam-label: 'spam'
          ai-label: 'ai-generated'
          minimize-detected-comments: true
          enable-spam-detection: true
          enable-link-spam-detection: true
          enable-ai-detection: true

      # Two layers of protection:
      # 1) Accounts younger than 7 days: delete or close
      # 2) Older accounts flagged as spam: delete or close
      - name: Spam defense
        uses: actions/github-script@v7
        with:
          script: |
            const MIN_ACCOUNT_AGE_DAYS = 7;
            const event = context.eventName;

            // Read event context
            let username, authorAssociation, number, nodeId, commentId;
            let isIssue = false, isPR = false, isComment = false;

            if (event === 'issues') {
              const issue = context.payload.issue;
              username = issue.user.login;
              authorAssociation = issue.author_association;
              number = issue.number;
              isIssue = true;
            } else if (event === 'issue_comment') {
              const comment = context.payload.comment;
              username = comment.user.login;
              authorAssociation = comment.author_association;
              number = context.payload.issue.number;
              nodeId = comment.node_id;
              commentId = comment.id;
              isComment = true;
              isIssue = true;
            } else if (event === 'pull_request') {
              const pr = context.payload.pull_request;
              username = pr.user.login;
              authorAssociation = pr.author_association;
              number = pr.number;
              isPR = true;
            } else if (event === 'pull_request_review_comment') {
              const comment = context.payload.comment;
              username = comment.user.login;
              authorAssociation = comment.author_association;
              number = context.payload.pull_request.number;
              nodeId = comment.node_id;
              commentId = comment.id;
              isComment = true;
              isPR = true;
            }

            // Skip project members
            if (['OWNER', 'MEMBER', 'COLLABORATOR'].includes(authorAssociation)) {
              core.info(`Skip: ${username} (${authorAssociation})`);
              return;
            }

            // Determine account age
            const { data: user } = await github.rest.users.getByUsername({ username });
            const accountAgeDays = Math.floor((Date.now() - new Date(user.created_at)) / 86400000);
            const isNewAccount = accountAgeDays < MIN_ACCOUNT_AGE_DAYS;

            // Determine whether to block
            let shouldBlock = false;
            let reason = '';

            if (isNewAccount) {
              // First layer: block new accounts
              shouldBlock = true;
              reason = `new account (${accountAgeDays}d < ${MIN_ACCOUNT_AGE_DAYS}d)`;
            } else {
              // Second layer: check spam verdict for older accounts
              let isSpam = false;
              if (isComment) {
                const { node } = await github.graphql(`
                  query($id: ID!) {
                    node(id: $id) {
                      ... on IssueComment { isMinimized }
                      ... on PullRequestReviewComment { isMinimized }
                    }
                  }
                `, { id: nodeId });
                isSpam = node?.isMinimized === true;
              } else {
                const { data: labels } = await github.rest.issues.listLabelsOnIssue({
                  ...context.repo,
                  issue_number: number
                });
                isSpam = labels.some(l => l.name === 'spam');
              }

              if (isSpam) {
                shouldBlock = true;
                reason = `spam detected (account age: ${accountAgeDays}d)`;
              }
            }

            if (!shouldBlock) {
              core.info(`${username} (${accountAgeDays}d): OK`);
              return;
            }

            core.info(`Blocking ${event} #${number} from ${username}: ${reason}`);

            // Choose a notice based on the reason
            const notice = isNewAccount
              ? [
                  `@${username} hello, and thank you for your interest in this project!`,
                  '',
                  'To keep the community free of spam and automated bot activity,',
                  `GitHub accounts must be at least **${MIN_ACCOUNT_AGE_DAYS} days old** to participate in this project.`,
                  '',
                  `Your account is ${accountAgeDays} days old and cannot participate yet.`,
                  `Please submit again once your account is ${MIN_ACCOUNT_AGE_DAYS} days old, or use the contact information in the project README.`,
                  '',
                  'Thank you for your understanding and support 🙏',
                ].join('\n')
              : [
                  `@${username} hello,`,
                  '',
                  'The automated moderation system flagged your content as spam and removed it.',
                  '',
                  '**If this was a mistake, please accept our apologies.** Use the contact information in the project README to report it.',
                  '',
                  'Thank you for your understanding 🙏',
                ].join('\n');

            // Apply moderation actions
            if (isComment) {
              // Comments: delete
              if (isIssue) {
                await github.rest.issues.deleteComment({
                  ...context.repo,
                  comment_id: commentId
                });
              } else {
                await github.rest.pulls.deleteReviewComment({
                  ...context.repo,
                  comment_id: commentId
                });
              }
            } else if (isIssue) {
              // New issue: post notice, close, and lock
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: number,
                body: notice
              });
              await github.rest.issues.update({
                ...context.repo,
                issue_number: number,
                state: 'closed',
                state_reason: 'not_planned'
              });
              await github.rest.issues.lock({
                ...context.repo,
                issue_number: number,
                lock_reason: 'spam'
              });
            } else if (isPR) {
              // New pull request: post notice and close
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: number,
                body: notice
              });
              await github.rest.pulls.update({
                ...context.repo,
                pull_number: number,
                state: 'closed'
              });
            }
